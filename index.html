<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการใบอนุญาตระดับพรีเมียม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #0B0E14; color: #E0E0E0; }
        .gold-text { color: #D4AF37; }
        .gold-border { border-color: #D4AF37; }
        .gold-bg { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.1); }
        .input-dark { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s; }
        .input-dark:focus { border-color: #D4AF37; outline: none; background: rgba(255, 255, 255, 0.1); }
        .magic-circle { border: 1px dashed rgba(212, 175, 55, 0.3); border-radius: 50%; animation: rotate 20s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="border-b border-white/5 py-6 px-8 flex justify-between items-center sticky top-0 bg-[#0B0E14]/80 backdrop-blur-md z-50">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 gold-border border-2 rounded-full flex items-center justify-center">
                <i data-lucide="shield-check" class="gold-text w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-widest uppercase">สถาบันตรวจสอบ<span class="gold-text">ใบอนุญาต</span></h1>
                <p class="text-[10px] text-gray-500 tracking-[0.3em]">PREMIUM AUTHENTICATION</p>
            </div>
        </div>
        <div class="hidden md:flex gap-6 text-sm">
            <a href="#request-section" class="hover:gold-text transition-colors">ยื่นคำขอ</a>
            <a href="#revoke-section" class="hover:gold-text transition-colors text-red-400">ยกเลิกใบอนุญาต</a>
        </div>
    </nav>

    <section class="flex flex-col items-center justify-center py-20 relative overflow-hidden">
        <div class="absolute w-[400px] h-[400px] magic-circle"></div>
        <div class="relative z-10 text-center">
            <div class="text-[80px] mb-4 opacity-80 luxury-serif italic gold-text">A</div>
            <p class="text-gray-400 tracking-[0.5em] uppercase text-sm font-light">The Sacred Seal of Registry</p>
        </div>
    </section>

    <main class="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12">
        
        <section id="request-section" class="glass-card p-10 rounded-[2rem]">
            <div class="flex items-center gap-3 mb-8">
                <i data-lucide="file-plus" class="gold-text"></i>
                <h3 class="text-2xl font-light">ยื่นคำขอใบอนุญาต</h3>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="text-xs text-gray-500 uppercase tracking-widest block mb-2">ชื่อผู้ถือครอง / องค์กร</label>
                    <input type="text" id="reqName" class="w-full p-4 rounded-xl input-dark" placeholder="ระบุชื่อจริงหรือชื่อบริษัท">
                </div>
                <div>
                    <label class="text-xs text-gray-500 uppercase tracking-widest block mb-2">ประเภทธุรกิจ</label>
                    <select id="reqType" class="w-full p-4 rounded-xl input-dark">
                        <option value="General">ทั่วไป (General)</option>
                        <option value="Premium">พรีเมียม (Premium)</option>
                        <option value="Elite">อีลิท (Elite)</option>
                    </select>
                </div>
                <button onclick="requestLicense()" class="w-full py-4 gold-bg text-black font-bold rounded-xl mt-4 hover:opacity-90 transition-all flex justify-center items-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> ส่งคำขอ
                </button>
            </div>
        </section>

        <section id="revoke-section" class="glass-card p-10 rounded-[2rem]">
            <div class="flex items-center gap-3 mb-8">
                <i data-lucide="trash-2" class="text-red-500"></i>
                <h3 class="text-2xl font-light">ยกเลิกใบอนุญาต</h3>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="text-xs text-gray-500 uppercase tracking-widest block mb-2">หมายเลขใบอนุญาตที่ต้องการยกเลิก</label>
                    <input type="text" id="revId" class="w-full p-4 rounded-xl input-dark" placeholder="ตัวอย่าง: LNC-2026-XXXX-X">
                </div>
                <div>
                    <label class="text-xs text-gray-500 uppercase tracking-widest block mb-2">เหตุผลในการยกเลิก</label>
                    <textarea id="revReason" class="w-full p-4 rounded-xl input-dark h-[100px]" placeholder="ระบุเหตุผลในการขอยกเลิก..."></textarea>
                </div>
                <button onclick="revokeLicense()" class="w-full py-4 border border-red-500/50 text-red-500 font-bold rounded-xl mt-4 hover:bg-red-500/10 transition-all flex justify-center items-center gap-2">
                    <i data-lucide="x-circle" class="w-4 h-4"></i> ยืนยันการยกเลิก
                </button>
            </div>
        </section>

    </main>

    <section class="max-w-6xl mx-auto px-6 mt-20">
        <h3 class="text-center text-gray-500 uppercase tracking-[0.4em] text-xs mb-10">รายการที่ทำล่าสุด</h3>
        <div id="logList" class="space-y-4">
            </div>
    </section>

    <script>
        // เริ่มต้นไอคอน
        lucide.createIcons();

        function requestLicense() {
            const name = document.getElementById('reqName').value;
            if(!name) return alert('กรุณาระบุชื่อผู้ถือครอง');

            const year = 2026;
            const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
            const lncId = `LNC-${year}-${randomStr}-${Math.floor(Math.random()*10)}`;
            
            addLog(lncId, name, 'ได้รับใบอนุญาต', 'emerald');
            alert('สร้างใบอนุญาตสำเร็จ: ' + lncId);
            document.getElementById('reqName').value = '';
        }

        function revokeLicense() {
            const id = document.getElementById('revId').value;
            if(!id) return alert('กรุณาระบุหมายเลขใบอนุญาต');

            addLog(id, 'ไม่ระบุผู้ถือครอง', 'ยกเลิกแล้ว', 'red');
            alert('ยกเลิกใบอนุญาต ' + id + ' เรียบร้อยแล้ว');
            document.getElementById('revId').value = '';
            document.getElementById('revReason').value = '';
        }

        function addLog(id, owner, status, color) {
            const list = document.getElementById('logList');
            const item = document.createElement('div');
            item.className = `glass-card p-6 rounded-2xl flex justify-between items-center border-l-4 border-${color}-500 transition-all hover:translate-x-2`;
            item.innerHTML = `
                <div>
                    <p class="text-xs text-gray-500 font-mono">${id}</p>
                    <p class="font-bold text-lg">${owner}</p>
                </div>
                <div class="text-right">
                    <span class="text-${color}-400 text-xs font-bold uppercase tracking-widest">${status}</span>
                    <p class="text-[10px] text-gray-600 mt-1">${new Date().toLocaleString('th-TH')}</p>
                </div>
            `;
            list.prepend(item);
        }
    </script>
</body>
</html>
