<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>THE SUPREME TERMINATION | GOVERNOR AYU MINAMOMA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@100;400;700;800&display=swap');

        body {
            background-color: #000;
            color: #c5a059;
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 0;
            overflow: hidden;
            display: flex; justify-content: center;
        }

        .credits-window {
            width: 85%;
            max-width: 900px;
            height: 100vh;
            position: relative;
        }

        .credits-content {
            position: absolute;
            top: 100%;
            width: 100%;
            text-align: center;
            /* ปรับเวลาเป็น 450 วินาทีเพื่อให้เลื่อนอ่านได้ทันสำหรับ 250+ ข้อความ */
            animation: scrollCredits 450s linear forwards; 
        }

        @keyframes scrollCredits {
            0% { top: 100%; }
            100% { top: -25000px; } /* ขยายระยะทางเลื่อนขึ้นให้ครอบคลุมเนื้อหาทั้งหมด */
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 3rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 12px;
            border-bottom: 3px solid #c5a059;
            display: inline-block;
            padding-bottom: 15px;
            margin-top: 100px;
        }

        .statement-text {
            font-size: 1.15rem;
            line-height: 2.8;
            margin-bottom: 1rem;
            opacity: 0.85;
            font-weight: 300;
        }

        .staff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 50px;
            margin-top: 50px;
            font-size: 1rem;
        }

        .role {
            text-align: right;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
        }

        .name {
            text-align: left;
            color: #fff;
        }

        .final-logo {
            margin-top: 500px;
            margin-bottom: 800px;
            font-size: 5.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px #c5a059;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, black 90%);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="vignette"></div>

    <div class="credits-window">
        <div class="credits-content" id="credits-engine">
            
            <div style="height: 300px;"></div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Garuda_Embblem_of_Thailand.svg/1200px-Garuda_Embblem_of_Thailand.svg.png" style="width: 120px; filter: brightness(0) invert(1); opacity: 0.3; margin-bottom: 50px;">

            <h2 class="section-title">แถลงการณ์ปิดวาระดิจิทัลอย่างเป็นทางการ</h2>
            <div id="statements-container"></div>

            <div style="height: 400px;"></div>

            <h2 class="section-title">ทำเนียบคณะทำงานสำนักผู้ว่าการ</h2>
            <div class="staff-grid" id="staff-container"></div>

            <div class="final-logo">
                AYU MINAMOMA
                <div style="font-size: 1.2rem; letter-spacing: 10px; color: #c5a059; margin-top: 30px; font-weight: 400;">
                    SYSTEM PERMANENTLY TERMINATED<br>
                    FEBRUARY 7, 2026
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. สร้าง 250 ข้อความแถลงการณ์ (สร้างแบบ Dynamic เพื่อประสิทธิภาพ)
        const baseStatements = [
            "โดยอำนาจแห่งสำนักผู้ว่าการอายู มินาโมมะ ขอประกาศยุติการทำงานของระบบสารสนเทศส่วนกลาง",
            "มาตรการรักษาความปลอดภัยขั้นสูงสุดระดับที่ 1780 ได้รับการอนุมัติใช้งานในทุกเซกเตอร์",
            "การทำลายชุดคำสั่งต้นฉบับ (Source Code) ได้ดำเนินการเสร็จสิ้นในรูปแบบถาวร",
            "ทุกการเชื่อมโยงเครือข่ายภายนอกถูกตัดขาดโดยสมบูรณ์เพื่อป้องกันการแทรกแซง",
            "ฐานข้อมูลทะเบียนราษฎร์และเอกสารลับได้รับการเข้ารหัสแบบ One-way Encryption ก่อนทำลาย",
            "รัฐอายูประกาศปิดเขตแดนทางข้อมูลและสารสนเทศนับแต่เวลาปัจจุบันเป็นต้นไป",
            "สิทธิประโยชน์และโควตาการเข้าถึงทรัพยากรทั้งหมดถูกดึงกลับสู่ศูนย์กลางการปกครอง",
            "ระบบคำนวณงบประมาณมหาภาคและการจัดสรรที่ดินหยุดการประมวลผลโดยดุษฎี",
            "คำพิพากษาของศาลปกครองพิเศษถือเป็นที่สิ้นสุดและถูกจารึกไว้ในฐานะจดหมายเหตุลับ",
            "ไม่มีภาคส่วนใดได้รับอนุญาตให้กู้คืนหรือจำลองระบบการบริหารนี้ขึ้นใหม่ในอนาคต",
            "ความสัตย์ปฏิญาณของคณะทำงานคือเกราะป้องกันความลับสุดท้ายแห่งรัฐ",
            "วิสัยทัศน์แห่งท่านผู้ว่าการจะยังคงอยู่เหนือโครงสร้างรหัสที่สลายไป",
            "ระเบียบโลกใหม่ภายใต้ระบบอายูได้รับการบรรลุวัตถุประสงค์ตามยุทธศาสตร์สูงสุด"
        ];

        // ขยายให้ครบ 250 ข้อความด้วยการสร้างประโยคเชิงนโยบายทางการ
        const statements = [];
        for(let i=1; i<=250; i++) {
            if(i <= baseStatements.length) {
                statements.push(baseStatements[i-1]);
            } else {
                const prefixes = ["ประกาศ", "ระเบียบ", "คำสั่ง", "บันทึก", "ข้อตกลง"];
                const subjects = ["ด้านความมั่นคง", "ด้านการคลัง", "ด้านตุลาการ", "ด้านข่าวกรอง", "ด้านทรัพยากร"];
                const actions = ["ได้รับการตรวจสอบและล้างค่าข้อมูล", "ถูกระงับการใช้งานถาวร", "ได้รับการคุ้มครองตามกฎหมายรัฐ", "ถูกทำลายตามระเบียบวาระ"];
                
                const randomText = `${prefixes[i%5]}${subjects[i%5]} ลำดับที่ ${i}: ข้อมูลชุดนี้${actions[i%4]}`;
                statements.push(randomText);
            }
        }

        // 2. รายชื่อ 100 ท่าน
        const staffNames = [
            "สมชาย วิวัฒนาการ", "เกศรินทร์ รุ่งเรือง", "ธนาวัต สายฟ้า", "วิมล ปัญญาไว",
            "นพดล เกียรติศักดิ์", "สิริมา ครองธรรม", "ปิยะพงษ์ มั่นคง", "วรัญญา ยั่งยืน",
            "ณัฐพล ยอดขวัญ", "ชลลดา นทีทอง", "เกรียงไกร กล้าหาญ", "มณีรัตน์ แสงสว่าง",
            "อภิชาติ อำนาจเจริญ", "พัชราภา สวยสมบูรณ์", "ธีรพงษ์ วงศ์สว่าง", "อรทัย ใจเย็น"
        ];
        for (let i = staffNames.length; i < 100; i++) {
            staffNames.push(`เจ้าหน้าที่ฝ่ายปกครองระดับสูง รหัส AYU-${1000 + i}`);
        }

        const roles = ["หัวหน้าหน่วยข่าวกรอง", "ผู้จัดการระบบฐานข้อมูล", "จารชนไซเบอร์", "ที่ปรึกษากฎหมายรัฐ"];

        // 3. Render Statements
        const statementContainer = document.getElementById('statements-container');
        statements.forEach(text => {
            const p = document.createElement('p');
            p.className = 'statement-text';
            p.innerText = text;
            statementContainer.appendChild(p);
        });

        // 4. Render Staff
        const staffContainer = document.getElementById('staff-container');
        staffNames.forEach(name => {
            const randomRole = roles[Math.floor(Math.random() * roles.length)];
            const roleDiv = document.createElement('div');
            roleDiv.className = 'role';
            roleDiv.innerText = randomRole;
            const nameDiv = document.createElement('div');
            nameDiv.className = 'name';
            nameDiv.innerText = name;
            staffContainer.appendChild(roleDiv);
            staffContainer.appendChild(nameDiv);
        });

        console.clear();
        console.log("SYSTEM STATUS: PERMANENTLY PURGED.");
    </script>
</body>
</html>
